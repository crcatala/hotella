name: Live Tests

# Maintainer-only live tests.
#
# Trigger: issue_comment `/run-live-tests` on a same-repo PR.
# Workflow always runs from the default branch; only the PR head SHA is checked out.
#
# Security model:
# - Only the repository owner can trigger
# - Fork PRs are rejected
# - The job that executes PR-controlled code has contents:read only (no write token)
# - Report job posts checks/comments and does not check out PR code
# - triggering_actor is re-checked so collaborators cannot re-run an owner-approved job

on:
  issue_comment:
    types: [created]

jobs:
  prepare:
    name: Authorize Live Tests
    # issue_comment workflows run from the default branch. The triggering actor
    # check also prevents a collaborator from re-running an owner-approved run.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '/run-live-tests' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubicloud-standard-2
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_sha: ${{ steps.pr.outputs.sha }}

    steps:
      - name: Get PR information
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.data.head.repo.full_name !== pr.data.base.repo.full_name) {
              core.setFailed('Live tests cannot run on fork PRs.');
              return;
            }

            core.setOutput('number', String(pr.data.number));
            core.setOutput('sha', pr.data.head.sha);

  test:
    name: Run Live Tests
    needs: prepare
    # Re-check authorization because a collaborator can re-run this job alone.
    if: |
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    # This job executes PR-controlled code. It deliberately has no write token.
    permissions:
      contents: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.pr_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live tests
        id: tests
        run: pnpm run test:live:verbose

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Live Test Results"
            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              echo "✅ All live tests passed"
            else
              echo "❌ Some live tests failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report Live Test Result
    needs: [prepare, test]
    # Re-check authorization because a collaborator can re-run this job alone.
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubicloud-standard-2
    permissions:
      checks: write
      # PR comments use the issues comments API but require pull-requests write.
      pull-requests: write

    steps:
      - name: Create check and comment on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const result = '${{ needs.test.result }}';
            const conclusion = result === 'success'
              ? 'success'
              : result === 'cancelled'
                ? 'cancelled'
                : 'failure';
            const passed = conclusion === 'success';
            const sha = '${{ needs.prepare.outputs.pr_sha }}';
            const logsUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const body = `${passed ? '✅ Live tests passed.' : '❌ Live tests failed.'} Tested commit: \`${sha}\`. [View logs](${logsUrl})`;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Live Tests',
              head_sha: sha,
              status: 'completed',
              conclusion,
              details_url: logsUrl,
              output: {
                title: passed ? 'Live tests passed' : 'Live tests failed',
                summary: `[View live-test logs](${logsUrl})`,
              },
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.prepare.outputs.pr_number }}'),
              body,
            });
