      - "Verbose output: '→ Resolving location \"NRT\" → \"Tokyo\"'"
      - "Integrated into search command: resolve location before passing to fetcher"
      - "Unit tests with mocked fetch for CSV download, cache TTL, code resolution"
      - "pnpm run verify passes"
    notes: |
      CSV source verified 2026-01-27: HTTP 200, ~9800 rows, well-structured.
      Repo github.com/lxndrblz/Airports — 204 stars, actively maintained.

      IMPORTANT: The CSV `city` column sometimes has suburbs instead of metro names
      (e.g. JFK → "Inwood", LAX → "El Segundo"). The `city_code` column maps to
      metro areas (TYO, NYC, PAR). Consider using city_code with a known metro name
      mapping, or use the city column with a small override map for common cases.
      The goal is that NRT→"Tokyo", CDG→"Paris", JFK→"New York", etc.

